<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/script.js" defer></script>
  
  <title>Weather App</title>
  
</head>
<body>
  <header> 
    <img src="./assets/images/logo.svg" alt="Логотип Weather Now">

    <div class="units">

      <button type="button" class="units__button">

        <img class="units__icon" src="./assets/images/icon-units.svg" alt="">

        <span class="units__title">Единицы измерения</span>

      </button>

        <ul class="units__list">
          <li class="units__item"><button class="units__item--btn" type="button" data-system="imperial">Переключиться на&nbsp;<span class="units__item--name">имперскую</span> систему</button></li>
          <li class="units__category">Температура</li>
          <li class="units__item">
            <button class="units__item--btn" type="button" data-unit="temperature" data-value="celsius">Цельсий (°C)</button>
            <img src="./assets/images/icon-checkmark.svg" alt="">
          </li>
          <li class="units__item">
            <button class="units__item--btn" type="button" data-unit="temperature" data-value="fahrenheit">Фаренгейт (°F)</button>
            <img src="./assets/images/icon-checkmark.svg" alt="">
          </li>
          <li class="units__category">Скорость ветра</li>
          <li class="units__item">
            <button class="units__item--btn" type="button" data-unit="wind" data-value="kmh">км/ч</button>
            <img src="./assets/images/icon-checkmark.svg" alt="">
          </li>
          <li class="units__item">
            <button class="units__item--btn" type="button" data-unit="wind" data-value="mph">миль/ч</button>
            <img src="./assets/images/icon-checkmark.svg" alt="">
          </li>
          <li class="units__category">Осадки</li>
          <li class="units__item">
            <button class="units__item--btn" type="button" data-unit="rainfall" data-value="mm">Миллиметры (мм)</button>
            <img src="./assets/images/icon-checkmark.svg" alt="">
          </li>
          <li class="units__item">
            <button class="units__item--btn" type="button" data-unit="rainfall" data-value="inch">Дюймы (in)</button>
            <img src="./assets/images/icon-checkmark.svg" alt="">
          </li>
        </ul>
    </div>
  </header>
  
  <main class="main">
    <h1 class="main__title">Что там с&nbsp;погодой?</h1>

    <form class="search">
      <div class="search__field">
        
        <img class="search__img" src="./assets/images/icon-search.svg" alt="">
        <input type="search" class="search__input" placeholder="Введите город..." autocomplete="off">

        <ul class="search__suggestions"></ul>
      </div>
    </form>

    <section class="today">

      <div class="today__card">

        <div class="today__info">
          <h2 class="today__title"><span class="today__city"></span><span class="today__country"></span></h2>
          <p class="today__day"></p>
        </div>

        <div class="today__weather">
          <img src="" alt="" class="today__icon">
          <p class="today__degrees"></p>
        </div>

      </div>

      <ul class="today__list">

        <li class="today__item">
          <p class="today__label">Ощущается как</p>
          <p class="today__value" id="feels"></p>
        </li>

        <li class="today__item">
          <p class="today__label">Влажность</p>
          <p class="today__value" id="humidity"></p>
        </li>
        
        <li class="today__item">
          <p class="today__label">Ветер</p>
          <p class="today__value" id="wind"></p>
        </li>
        
        <li class="today__item">
          <p class="today__label">Осадки</p>
          <p class="today__value" id="precipitation"></p>
        </li>
      </ul>
    </section>

    <section class="daily">
      <h3 class="daily__title">Ежедневный прогноз</h3>
      <div class="daily__list">
        <ul class="daily__items">
        </ul>
      </div>
    </section>

    <section class="hourly">
      <h3 class="hourly__title">Почасовой прогноз</h3>
      <div class="hourly__list">
        <ul class="hourly__items">
          </ul>
      </div>
    </section>

  </main>
</body>
</html>
